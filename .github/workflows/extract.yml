name: Extract VYRO source files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source ZIP
        run: |
          unzip -o VYRO-github.zip -d .
          rm VYRO-github.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract VYRO source files" || echo "No changes to commit"
          git push
